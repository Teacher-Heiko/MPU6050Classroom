<svg xmlns='http://www.w3.org/2000/svg' width='760' height='420' viewBox='0 0 760 420' font-family='Helvetica, Arial, sans-serif'>
<rect width='760' height='420' rx='14' fill='#ffffff' stroke='#d0d7de'/>
<defs><marker id='ar' markerUnits='userSpaceOnUse' markerWidth='14' markerHeight='14' refX='11' refY='7' orient='auto'><path d='M0,0 L14,7 L0,14 z' fill='#1f2328'/></marker><marker id='rot' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='9' refY='6' orient='auto'><path d='M0,0 L12,6 L0,12 z' fill='#cf222e'/></marker></defs>
<polygon points='90,280 350,280 410,200 150,200' fill='#1f4e8c' stroke='#0b2a52' stroke-width='2'/>
<polygon points='220,254 270,254 282,226 232,226' fill='#24292f'/>
<text x='251' y='244' fill='#ffffff' font-size='10' text-anchor='middle'>chip</text>
<line x1='251' y1='240' x2='470' y2='240' stroke='#1f2328' stroke-width='3' marker-end='url(#ar)'/>
<text x='478' y='246' font-size='18' font-weight='bold' fill='#1f2328'>X</text>
<line x1='251' y1='240' x2='350' y2='110' stroke='#1f2328' stroke-width='3' marker-end='url(#ar)'/>
<text x='356' y='104' font-size='18' font-weight='bold' fill='#1f2328'>Y</text>
<line x1='251' y1='240' x2='251' y2='50' stroke='#1f2328' stroke-width='3' marker-end='url(#ar)'/>
<text x='260' y='48' font-size='18' font-weight='bold' fill='#1f2328'>Z</text>
<path d='M425,212 A18,30 0 1,1 425,268' fill='none' stroke='#cf222e' stroke-width='3' marker-end='url(#rot)'/>
<path d='M302,148 A30,14 -50 1,1 332,168' fill='none' stroke='#cf222e' stroke-width='3' marker-end='url(#rot)'/>
<path d='M226,90 A26,10 0 1,0 276,90' fill='none' stroke='#cf222e' stroke-width='3' marker-end='url(#rot)'/>
<text x='560' y='70' font-size='16' font-weight='bold' fill='#1f2328'>Three angles</text>
<text x='560' y='110' font-size='16' font-weight='bold' fill='#cf222e'>roll</text>
<text x='560' y='130' font-size='13' fill='#1f2328'>turning around X:</text>
<text x='560' y='148' font-size='13' fill='#57606a'>tipping one long side up or down</text>
<text x='560' y='180' font-size='16' font-weight='bold' fill='#cf222e'>pitch</text>
<text x='560' y='200' font-size='13' fill='#1f2328'>turning around Y:</text>
<text x='560' y='218' font-size='13' fill='#57606a'>tipping the X end up or down</text>
<text x='560' y='250' font-size='16' font-weight='bold' fill='#cf222e'>yaw</text>
<text x='560' y='270' font-size='13' fill='#1f2328'>turning around Z:</text>
<text x='560' y='288' font-size='13' fill='#57606a'>turning it flat on the table</text>
<text x='380.0' y='380' font-size='13' fill='#57606a' text-anchor='middle'>The X and Y arrows printed on your sensor board show its axes. Z points up, out of the board.</text>
<text x='380.0' y='400' font-size='13' fill='#57606a' text-anchor='middle'>Which way a number counts up: run 1c_YawPitchRoll, tilt the board, and watch.</text>
</svg>